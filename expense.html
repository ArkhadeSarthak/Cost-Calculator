<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Crop Cost Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container my-4">
        <h2 class="text-center mb-4 text-success">🌾 Crop Cost Calculator</h2>


        <div class="card mb-3">
            <div class="card-body">
                <h5 class="section-title">Expense</h5>
                <div class="row" id="expenseForm">
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Enter Cost (खर्च)</label>
                        <input type="number" class="form-control" placeholder="₹" id="cost">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Cost For</label>
                        <select class="form-select" id="costFor">
                            <option>Select</option>
                            <option>Machinery (यंत्रसामग्री)</option>
                            <option>Seed (बियाणे)</option>
                            <option>Fertilizers (खत)</option>
                            <option>Irrigation (सिंचन/पाण्याचा)</option>
                            <option>Medicine (औषध)</option>
                            <option>Labour (मजुरी)</option>
                            <option>Other (इतर)</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Date (तारीख)</label>
                        <input type="date" class="form-control" id="date">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Note (नोंद)</label>
                        <input type="text" class="form-control" placeholder="📝" id="note">
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-calc px-5 py-2" onclick="saveExpense()">Save Expense</button>
            <button type="submit" class="btn btn-calc px-5 py-2" onclick="back()">Cancel</button>
        </div>

    </div>

    <div class="message-container">
        <div class="message error" id="error">Enter All Data</div>
        <div class="message success" id="success">Added successfully!</div>
        <div class="message info" id="info">Info: Your session will expire in 10 minutes.</div>
    </div>

    <script src="index.js"></script>
</body>

</html>
