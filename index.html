<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Crop Cost Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container my-4" id="mainOfAll">
        <h2 class="text-center mb-4 text-success">🌾 Crop Cost Calculator</h2>

        <div class="card mb-3">
            <div class="card-body">
                <h5 class="section-title">All Details</h5>
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <h3>Cost</h3>
                        <h4 id="costDone">₹ : </h4>
                    </div>

                    <div class="col-md-4 mb-2">
                        <h3>Revenue</h3>
                        <h4 id="revenue">₹ : </h4>
                    </div>

                    <div class="col-md-4 mb-2">
                        <h3>Net Income</h3>
                        <h4 id="netIncome">₹ : </h4>
                    </div>
                </div>
            </div>
        </div>


        <div class="text-center">
            <button class="btn btn-calc px-5 py-2" onclick="addExpense()">Add Expense</button>
            <button class="btn btn-calc px-5 py-2" onclick="addIncome()">Add Income</button>
            <button class="btn btn-calc px-5 py-2" onclick="toConfirm()">Clear All</button>
        </div>

        <h4 class="history">History :</h4>
        <div class="tbl">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Cost</th>
                        <th>Cost For</th>
                        <th>Note</th>
                    </tr>
                </thead>
                <tbody id="tbody">

                </tbody>
            </table>
        </div>

    </div>

    <div class="message-container">
        <div class="message error" id="error">Invalid username or password.</div>
        <div class="message success" id="success">Added successfully!</div>
        <div class="message info" id="info">Info: Your session will expire in 10 minutes.</div>
    </div>

    <div id="confirmDiv" class="confirm-overlay">
        <div class="confirm-box">
            <p>Are you sure you want to reset?</p>
            <button onclick="confirmYes()" id="confirmYes">Yes</button>
            <button onclick="confirmNo()" id="confirmNo">No</button>
        </div>
    </div>


    <script src="index.js"></script>
</body>

</html>
